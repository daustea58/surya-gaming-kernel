name: Build Surya Gaming Kernel

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev \
            libncurses-dev libelf-dev python3 python3-pip unzip zip \
            rsync kmod cpio device-tree-compiler

      - name: Run build script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload flashable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surya-gaming-kernel
          path: out/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          if-no-files-found: ignore
          retention-days: 14
